name: Auto Save to Wayback Machine
on:
  push:
    branches: [ master ]
    paths:
      - '**.md'
      - 'source/**'
      - 'content/**'
      - '.github/workflows/snapshot.yml'
  workflow_dispatch:
  schedule:
    # 北京时间 早上 08:51 (UTC 00:51)
    - cron: '19 2 * * *'
    # 北京时间 中午 12:21 (UTC 04:21)
    - cron: '21 4 * * *'
    # 北京时间 晚上 20:00 (UTC 12:00)
    - cron: '0 12 * * *'

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 步骤1：前置校验URL可用性，过滤不可达页面，解决fetch failed问题
      - name: 前置校验URL可达性
        id: url-check
        run: |
          cat > urls.txt << 'EOF'
          https://senchin.dpdns.org/
          https://senchin.dpdns.org/about/
          https://senchin.dpdns.org/archives/
          https://senchin.dpdns.org/categories/
          https://senchin.dpdns.org/tags/
          https://senchin.dpdns.org/link/
          https://senchin.dpdns.org/Gallery/
          https://senchin.dpdns.org/live/
          https://senchin.dpdns.org/media/
          https://senchin.dpdns.org/movies/
          https://senchin.dpdns.org/music/
          https://senchin.dpdns.org/timeline/
          EOF

          echo "=== 开始校验URL可达性 ==="
          valid_urls=""
          failed_urls=""
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            echo "检查: $url"
            if curl -sL --head --connect-timeout 10 --max-time 15 "$url" | grep -qE "HTTP/[0-9.]+ [23][0-9]{2}"; then
              echo "✅ 可达"
              valid_urls+="$url"$'\n'
            else
              echo "❌ 不可达"
              failed_urls+="$url"$'\n'
            fi
            sleep 2
          done < urls.txt

          echo "valid_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$valid_urls" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "failed_urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$failed_urls" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # 步骤2：带重试的存档操作，官方合规语法，失败自动重试3次，间隔60秒
      - name: 批量存档到Wayback Machine
        uses: actions-cool/retry-action@v1
        with:
          max-attempts: 3
          retry-interval: 60
          shell: bash
          run: |
            echo "${{ steps.url-check.outputs.valid_urls }}" | while IFS= read -r url; do
              [ -z "$url" ] && continue
              echo "正在存档: $url"
              curl -sL "https://web.archive.org/save/$url" \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                --connect-timeout 30 \
                --max-time 60
              echo ""
              sleep 30
            done

      # 步骤3：输出最终结果，方便排查问题
      - name: 输出存档结果
        run: |
          echo "==================== 任务结果 ===================="
          echo "执行时间：北京时间 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "✅ 有效URL（已提交存档）："
          echo "${{ steps.url-check.outputs.valid_urls }}"
          echo ""
          echo "❌ 不可达URL（未提交存档）："
          echo "${{ steps.url-check.outputs.failed_urls }}"
          echo ""
          echo "任务详情：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=================================================="
