name: Auto Save to Wayback Machine
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'  # 北京时间 08:17
    - cron: '23 4 * * *'  # 北京时间 12:23
    - cron: '41 8 * * *'  # 北京时间 16:41
    - cron: '53 12 * * *' # 北京时间 20:53
    - cron: '17 16 * * *' # 北京时间 00:17
    - cron: '23 20 * * *' # 北京时间 04:23
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save to Wayback Machine
        uses: JamieMagee/wayback@v2
        with:
          url: "https://senchin.dpdns.org"
          retries: 3
          retryDelay: 60
