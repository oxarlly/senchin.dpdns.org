name: Auto Save to Wayback Machine
on:
  push:
  workflow_dispatch:
  schedule:
    # 北京时间 08:30
    - cron: '30 0 * * *'
    # 北京时间 12:30
    - cron: '30 4 * * *'
    # 北京时间 16:00
    - cron: '0 8 * * *'
    # 北京时间 20:00
    - cron: '0 12 * * *'
    # 北京时间 22:30
    - cron: '30 14 * * *'
    # 北京时间 23:50
    - cron: '50 15 * * *'

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save to Wayback Machine
        uses: JamieMagee/wayback@v2
        with:
          url: "https://senchin.dpdns.org"
          # 失败自动重试3次，每次间隔60秒
          retries: 3
          retryDelay: 60
