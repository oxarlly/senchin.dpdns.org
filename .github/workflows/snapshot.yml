name: Wayback Machine 博客自动存档

# 1. 每4小时定时触发 + 手动可触发
on:
  schedule:
    - cron: '0 */4 * * *'
    - cron: '45 1 * * *'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行 Wayback 归档脚本
        run: |
          python - <<END
          import requests
          import time

          # 需要归档的 URL 列表
          urls = [
              "https://senchin.dpdns.org/",
              "https://senchin.dpdns.org/about/",
              "https://senchin.dpdns.org/archives/",
              "https://senchin.dpdns.org/categories/",
              "https://senchin.dpdns.org/tags/",
              "https://senchin.dpdns.org/link/",
              "https://senchin.dpdns.org/Gallery/",
              "https://senchin.dpdns.org/live/",
              "https://senchin.dpdns.org/media/",
              "https://senchin.dpdns.org/movies/",
              "https://senchin.dpdns.org/music/",
              "https://senchin.dpdns.org/timeline/"
          ]

          # 逐个提交到 Wayback Machine
          for url in urls:
              print(f"正在归档: {url}")
              try:
                  res = requests.get(f"https://web.archive.org/save/{url}", timeout=30)
                  if res.status_code == 200:
                      print(f"✅ 归档成功: {url}")
                  else:
                      print(f"❌ 归档失败 状态码:{res.status_code} -> {url}")
              except Exception as e:
                  print(f"❌ 异常错误: {url} -> {str(e)}")
              # 间隔 15 秒，防止请求过快被拦截
              time.sleep(15)
          END
