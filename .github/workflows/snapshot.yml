name: Auto Save to Wayback Machine

on:
  push:
  workflow_dispatch:
  schedule:
    # 北京时间 早上 08:51 (UTC 00:51)
    - cron: '51 0 * * *'
    # 北京时间 中午 12:21 (UTC 04:21)
    - cron: '53 1 * * *'
    # 北京时间 晚上 20:00 (UTC 12:00)
    - cron: '0 12 * * *'

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save multiple URLs to Wayback Machine
        uses: JamieMagee/wayback@v2
        with:
          url: |
            https://senchin.dpdns.org/
            https://senchin.dpdns.org/about/
            https://senchin.dpdns.org/archives/
            https://senchin.dpdns.org/categories/
            https://senchin.dpdns.org/tags/
            https://senchin.dpdns.org/link/
            https://senchin.dpdns.org/Gallery/
            https://senchin.dpdns.org/live/
            https://senchin.dpdns.org/media/
            https://senchin.dpdns.org/movies/
            https://senchin.dpdns.org/music/
            https://senchin.dpdns.org/timeline/
          retries: 3
          retryDelay: 60
