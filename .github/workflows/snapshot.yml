name: Auto Save to Wayback Machine
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'  # 北京时间 08:17
    - cron: '23 4 * * *'  # 北京时间 12:23
    - cron: '41 10 * * *' # 北京时间 18:41

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save to Wayback Machine
        uses: JamieMagee/wayback@v2
        with:
          url: "https://senchin.dpdns.org"
          # 失败自动重试3次，每次间隔60秒
          retries: 3
          retryDelay: 60
