name: Package Repository ZIP & Upload to Release
run-name: Package and Upload to Release
on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date in yyyy‑mm‑dd format
        id: get_date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download master branch ZIP of current repository
        run: |
          wget https://github.com/${{ github.repository }}/archive/refs/heads/master.zip -O ${{ env.DATE }}.zip

      - name: Create / Update Release Backup
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Backup
          name: Daily Backup ${{ env.DATE }}
          files: ${{ env.DATE }}.zip
          overwrite_files: true
          allow_blank_comments: true
        env:
          # 必须使用你自己的 PAT，不要用默认 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
